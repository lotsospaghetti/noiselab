---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
## The "default" noiselab image, not straying very far from Fedora 44's usual stack
## - Arch: x86_64
## - Kernel: generic
## - NVIDIA: No
## - Audio: Pipewire
## - Desktop: GNOME (Wayland)

name: noiselab
description: Pro audio image optimized for low-spec devices

base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:
  - type: os-release
    properties:
      PRETTY_NAME: noiselab (FROM BlueBuild fedora-silverblue)

  - from-file: common/files.yml
  - from-file: kernel/generic.yml
  - from-file: audio-backend/pipewire.yml
  - from-file: common/packages.yml
  - from-file: common/services.yml

  - type: dnf
    repos:
      files:
        - https://repo.librewolf.net/librewolf.repo
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - librewolf
        - gnome-menus
        - gnome-extensions-apps
        - gnome-shell-extension-pipewire-settings
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-drive-menu
        - gnome-shell-extension-just-perfection
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: gnome-extensions
    install:
      - 6099 # PaperWM
      - 5895 # App Hider
      - 973 # Switcher
      - 4688 # Focus Follows Workspace

  - from-file: common/finalize.yml
