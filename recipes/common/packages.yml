---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
## Install packages and package managers for all images

modules:
  - type: dnf
    repos:
      nonfree: negativo17
      cleanup: true
    install:
      install-weak-deps: false
      packages:
        - alsa-firmware
        - alsa-tools
        - alsa-utils
        - alsamixergui
        - jack-mixer
        - pavucontrol
        - qjackctl
        - kernel-tools
        - realtime-setup
        - gamemode
        - tuned-gtk
        - tuned-profiles-cpu-partitioning
        - tuned-profiles-realtime
        - gum
        - yq
        - ardour9
        - mixxx
        - mpv
        - yoshimi
        - zita-at1
        - zita-rev1
        - fluidsynth
        - fluid-soundfont-gm
        - flac
        - ffmpeg
        - cdrecord
        - mkisofs
        - cdda2wav
        - rar
        - bottles
      exclude:
        - jack-audio-connection-kit
        - pipewire-jack-audio-connection-kit

  - type: dnf
    repos:
      copr:
        - ycollet/audinux
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - Carla-mao
        - raysession
        - millisecond
        - jack-link
        - jack_capture
        - jack_delay
        - jack_utils
        - jackctlmmc
        - jackass
        - timemachine
        - yabridge
        - yabridge-tui
        - lmms-mao-weekly
        - BespokeSynth
        - tenacity
        - mamba
        - samplecat
        - lsp-plugins
        - dpf-plugins
        - DISTRHO-Ports
        - surge-xt
        - amsynth
        - guitarix
        - hamburger
        - valentine
        - dragonfly-reverb
        - puredata
        - orca-lang
      exclude:
        - jack-audio-connection-kit
        - pipewire-jack-audio-connection-kit

  - type: soar
    auto-upgrade: true
    upgrade-interval: "12h"
