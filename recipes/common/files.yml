---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
## Move common system files into all images

modules:
  - type: files
    files:
      - source: system/common
        destination: /

  - type: justfiles
    validate: true
    install: true
    include:
      - noiselab.just

  - type: script
    snippets:
      - "echo 'Install yabridge-bottles-wineloader script'; curl 'https://raw.githubusercontent.com/microfortnight/yabridge-bottles-wineloader/refs/heads/main/wineloader.sh' > /usr/bin/wineloader && chmod +x /usr/bin/wineloader"
